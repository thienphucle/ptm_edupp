[project]
name = "ptm-eduplannerplus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lê Ngọc Thiên Phúc", email = "ntphuclee@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "hdbscan>=0.8.44",
    "numpy>=2.5.4",
    "openai>=3.49.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sentence-transformers>=6.2.0",
    "umap-learn>=0.6.0",
]

[project.scripts]
ptm-eduplannerplus = "ptm_eduplannerplus:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["ptm", "agents"]
module-root = "src"

